version: '3.9'

services:
    postgres_db:
        image: postgres:17-alpine
        container_name: postgres_db
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: the-wild-oasis-db

volumes:
    postgres_data:
