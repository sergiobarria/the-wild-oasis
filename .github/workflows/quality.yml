name: Quality

on:
    pull_request:
        branches: [main, dev]
    push:
        branches: [main, dev]

permissions:
    contents: read

concurrency:
    group: quality-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    # Placeholders: the build validates env vars via lib/env.ts but never
    # reaches a real deployment in CI.
    CONVEX_DEPLOYMENT: dev:ci-placeholder
    NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
    NEXT_PUBLIC_CONVEX_SITE_URL: https://placeholder.convex.site
    NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
    quality:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check formatting and linting
              run: bun run check

            - name: Typecheck
              run: bun run typecheck

            - name: Run tests with coverage
              run: bun run test:coverage

            - name: Build production application
              run: bun run build

            - name: Install Chromium
              run: bunx playwright install --with-deps chromium

            - name: Run Chromium smoke tests
              run: bun run test:e2e

            - name: Upload test artifacts
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: test-artifacts
                  path: |
                      coverage
                      playwright-report
                      test-results
                  if-no-files-found: ignore
                  retention-days: 7
